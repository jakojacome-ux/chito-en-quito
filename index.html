<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <title>Chito en Quito</title>

    <meta name="theme-color" content="#d1ab80" />
    <meta name="apple-mobile-web-app-title" content="Chito en Quito" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/chito-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/chito-icon.svg" />
  </head>

  <body class="landing-active">
    <main id="app">
      <div id="game-shell"></div>
    </main>

    <section id="landing-screen">
      <div class="landing-art">
        <div class="landing-sun"></div>
        <div class="landing-cloud cloud-one"></div>
        <div class="landing-cloud cloud-two"></div>

        <div class="landing-mountains mountain-back"></div>
        <div class="landing-mountains mountain-front"></div>

        <div class="landing-city">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="landing-card">
          <div class="landing-logo">
            <span>Chito</span>
            <span>en Quito</span>
          </div>

          <p class="landing-subtitle">
            Encuentra el café en el Centro Histórico
          </p>

          <button id="enter-game-button" type="button">
            Entrar al juego
          </button>

          <p id="landing-helper" class="landing-helper">
            Diseñado para jugar en horizontal.
          </p>
        </div>
      </div>
    </section>

    <div id="mobile-controls">
      <div class="mobile-controls-left">
        <button class="mobile-btn mobile-btn-blue" data-control="left">←</button>
        <button class="mobile-btn mobile-btn-blue" data-control="right">→</button>
      </div>

      <div class="mobile-controls-right">
        <button class="mobile-btn mobile-btn-purple" data-control="dash">⚡</button>
        <button class="mobile-btn mobile-btn-yellow" data-control="jump">↑</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
